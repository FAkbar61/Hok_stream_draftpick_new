<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honor Of Kings Draft Pick WebApp (Manual)</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="timer-container">
        <div class="timer-bar" id="timer-bar"></div>
    </div>
    <div class="mainbox">

        <div class="upper">

            <div class="upperleft">

                <div class="ghostboxban"></div>

                <div class="ban">
                    <div id="image-display-6" class="image-display"></div>
                </div>
                <div class="ban">
                    <div id="image-display-7" class="image-display"></div>
                </div>
                <div class="ban">
                    <div id="image-display-8" class="image-display"></div>
                </div>
                <div class="ban">
                    <div id="image-display-9" class="image-display"></div>
                </div>

                <div class="bluesideteam">
                    <div class="team-name-display1" id="teamNameDisplay1">Blue Side</div>
                </div>
                <div class="bluesidescore">
                    <div class="team-name-display3" id="teamNameDisplay3">0</div>
                </div>
            </div>

            <div class="uppermid">
                <div id="tournamentnameOutput" class="tournamentnameOutput"></div>
                <img class="midbackground" src="Assets/Other/logotengah2.png" alt="Logo">
            </div>

            <div class="upperright">

                <div class="redsidescore">
                    <div class="team-name-display4" id="teamNameDisplay4">0</div>
                </div>
                <div class="redsideteam">
                    <div class="team-name-display2" id="teamNameDisplay2">Red Side</div>
                </div>

                <div class="ban2">
                    <div id="image-display-18" class="image-display"></div>
                </div>
                <div class="ban2">
                    <div id="image-display-17" class="image-display"></div>
                </div>
                <div class="ban2">
                    <div id="image-display-16" class="image-display"></div>
                </div>
                <div class="ban2">
                    <div id="image-display-15" class="image-display"></div>
                </div>

            </div>

        </div>

        <div class="lower">

            <div class="lowerleft">

                <div class="pick">
                    <div id="image-display-1" class="image-display"></div>
                </div>

                <div class="pick">
                    <div id="image-display-2" class="image-display"></div>
                </div>

                <div class="pick">
                    <div id="image-display-3" class="image-display"></div>
                </div>

                <div class="pick">
                    <div id="image-display-4" class="image-display"></div>
                </div>

                <div class="pick">
                    <div id="image-display-5" class="image-display"></div>
                </div>

            </div>

            <div class="lowermid">

                <div class="phase" id="phase"></div>

                <div class="arrowdirection">
                    <div class="timer" id="timer">60</div>

                    <div class="direction" id="direction">
                        <img id="arrow" src="Assets/Other/Adjustment.gif" alt="Arrow">
                    </div>

                </div>
            </div>

            <div class="lowerright">

                <div class="pick2">
                    <div id="image-display-14" class="image-display"></div>
                </div>

                <div class="pick2">
                    <div id="image-display-13" class="image-display"></div>
                </div>

                <div class="pick2">
                    <div id="image-display-12" class="image-display"></div>
                </div>

                <div class="pick2">
                    <div id="image-display-11" class="image-display"></div>
                </div>

                <div class="pick2">
                    <div id="image-display-10" class="image-display"></div>
                </div>

            </div>

        </div>

        <div class="nameholder">

            <div class="nameholderbox">
                <div class="outputContainer">
                    <p id="output1"></p>
                </div>
            </div>

            <div class="nameholderbox">
                <div class="outputContainer">
                    <p id="output2"></p>
                </div>
            </div>

            <div class="nameholderbox">
                <div class="outputContainer">
                    <p id="output3"></p>
                </div>
            </div>

            <div class="nameholderbox">
                <div class="outputContainer">
                    <p id="output4"></p>
                </div>
            </div>

            <div class="nameholderbox">
                <div class="outputContainer">
                    <p id="output5"></p>
                </div>
            </div>

            <div class="ghostnamebox">

                <div class="bluelogo">
                    <div class="image-container">
                        <img id="image1" src="Assets/Other/UIN JKT ESPORT Original.png" alt="UIN JKT ESPORT"
                            onclick="swapContent()">
                    </div>
                </div>

                <div class="ghostmidlogoholder"></div>

                <div class="redlogo">
                    <div class="image-container">
                        <img id="image2" src="Assets/Other/UIN JKT ESPORT Original.png" alt="UIN JKT ESPORT"
                            onclick="swapContent()">
                    </div>
                </div>

            </div>

            <div class="nameholderbox2">
                <div class="outputContainer">
                    <p id="output10"></p>
                </div>
            </div>

            <div class="nameholderbox2">
                <div class="outputContainer">
                    <p id="output9"></p>
                </div>
            </div>

            <div class="nameholderbox2">
                <div class="outputContainer">
                    <p id="output8"></p>
                </div>
            </div>

            <div class="nameholderbox2">
                <div class="outputContainer">
                    <p id="output7"></p>
                </div>
            </div>

            <div class="nameholderbox2">
                <div class="outputContainer">
                    <p id="output6"></p>
                </div>
            </div>

        </div>

    </div>

    <!-- Control -->

    <div class="control">
        <h1>CONTROL</h1>
        <button class="controlbutton" onclick="resetAllDropdowns()">Reset Pick</button>

        <button class="controlbutton" onclick="resetInputs()">Reset Nick</button>
        <button class="controlbutton" onclick="switchInputs()">Switch Nickname</button>

        <!-- Tombol untuk reset dan switch all -->
        <button class="controlbutton" onclick="switchAll()">Switch Team</button>
        <button class="controlbutton" onclick="resetContent()">Reset</button>

        <!-- Input Box Tournament Name -->
        <input type="text" id="tournamentnamemid" class="tournamentnamebox"
            placeholder="Masukkan nama turnamen di sini">
    </div>

    <!-- Input untuk 1-5 -->

    <div class="allcontrol">
        <div class="bluesidecontrol">
            <h2>Nickname</h2>
            <label for="input1">1</label>
            <input type="text" id="input1" oninput="updateOutput()"><br>
            <label for="input2">2</label>
            <input type="text" id="input2" oninput="updateOutput()"><br>
            <label for="input3">3</label>
            <input type="text" id="input3" oninput="updateOutput()"><br>
            <label for="input4">4</label>
            <input type="text" id="input4" oninput="updateOutput()"><br>
            <label for="input5">5</label>
            <input type="text" id="input5" oninput="updateOutput()"><br>
        </div>

        <div class="bluesidepick">
            <div class="dropdowns-container">
                <h2>Pick</h2>
                <div class="dropdown-container">
                    <input type="text" id="search-1" class="dropdown" placeholder="Blue Side Pick 1"
                        oninput="filterDropdown(1)">
                    <div id="dropdown-items-1" class="dropdown-items"></div>
                </div>
                <div class="dropdown-container">
                    <input type="text" id="search-2" class="dropdown" placeholder="Blue Side Pick 2"
                        oninput="filterDropdown(2)">
                    <div id="dropdown-items-2" class="dropdown-items"></div>
                </div>
                <div class="dropdown-container">
                    <input type="text" id="search-3" class="dropdown" placeholder="Blue Side Pick 3"
                        oninput="filterDropdown(3)">
                    <div id="dropdown-items-3" class="dropdown-items"></div>
                </div>
                <div class="dropdown-container">
                    <input type="text" id="search-4" class="dropdown" placeholder="Blue Side Pick 4"
                        oninput="filterDropdown(4)">
                    <div id="dropdown-items-4" class="dropdown-items"></div>
                </div>
                <div class="dropdown-container">
                    <input type="text" id="search-5" class="dropdown" placeholder="Blue Side Pick 5"
                        oninput="filterDropdown(5)">
                    <div id="dropdown-items-5" class="dropdown-items"></div>
                </div>
            </div>
        </div>

        <div class="bluesideban">
            <div class="dropdowns-container">
                <h2>Ban</h2>
                <div class="dropdown-container">
                    <input type="text" id="search-6" class="dropdown" placeholder="Blue Side ban 1"
                        oninput="filterDropdown(6)">
                    <div id="dropdown-items-6" class="dropdown-items"></div>
                </div>
                <div class="dropdown-container">
                    <input type="text" id="search-7" class="dropdown" placeholder="Blue Side ban 2"
                        oninput="filterDropdown(7)">
                    <div id="dropdown-items-7" class="dropdown-items"></div>
                </div>
                <div class="dropdown-container">
                    <input type="text" id="search-8" class="dropdown" placeholder="Blue Side ban 3"
                        oninput="filterDropdown(8)">
                    <div id="dropdown-items-8" class="dropdown-items"></div>
                </div>
                <div class="dropdown-container">
                    <input type="text" id="search-9" class="dropdown" placeholder="Blue Side ban 4"
                        oninput="filterDropdown(9)">
                    <div id="dropdown-items-9" class="dropdown-items"></div>
                </div>
            </div>
        </div>

        <!-- Input untuk 6-10 -->
        <div class="redsidecontrol">
            <h2>Nickname</h2>
            <label for="input6">1</label>
            <input type="text" id="input6" oninput="updateOutput()"><br>
            <label for="input7">2</label>
            <input type="text" id="input7" oninput="updateOutput()"><br>
            <label for="input8">3</label>
            <input type="text" id="input8" oninput="updateOutput()"><br>
            <label for="input9">4</label>
            <input type="text" id="input9" oninput="updateOutput()"><br>
            <label for="input10">5</label>
            <input type="text" id="input10" oninput="updateOutput()"><br>
        </div>

        <div class="redesidepick">
            <div class="dropdowns-container">
                <h2>Pick</h2>
                <div class="dropdown-container">
                    <input type="text" id="search-10" class="dropdown" placeholder="Red Side Pick 1"
                        oninput="filterDropdown(10)">
                    <div id="dropdown-items-10" class="dropdown-items"></div>
                </div>
                <div class="dropdown-container">
                    <input type="text" id="search-11" class="dropdown" placeholder="Red Side Pick 2"
                        oninput="filterDropdown(11)">
                    <div id="dropdown-items-11" class="dropdown-items"></div>
                </div>
                <div class="dropdown-container">
                    <input type="text" id="search-12" class="dropdown" placeholder="Red Side Pick 3"
                        oninput="filterDropdown(12)">
                    <div id="dropdown-items-12" class="dropdown-items"></div>
                </div>
                <div class="dropdown-container">
                    <input type="text" id="search-13" class="dropdown" placeholder="Red Side Pick 4"
                        oninput="filterDropdown(13)">
                    <div id="dropdown-items-13" class="dropdown-items"></div>
                </div>
                <div class="dropdown-container">
                    <input type="text" id="search-14" class="dropdown" placeholder="Red Side Pick 5"
                        oninput="filterDropdown(14)">
                    <div id="dropdown-items-14" class="dropdown-items"></div>
                </div>
            </div>
        </div>

        <div class="redesideban">
            <div class="dropdowns-container">
                <h2>Ban</h2>
                <div class="dropdown-container">
                    <input type="text" id="search-15" class="dropdown" placeholder="Red Side ban 1"
                        oninput="filterDropdown(15)">
                    <div id="dropdown-items-15" class="dropdown-items"></div>
                </div>
                <div class="dropdown-container">
                    <input type="text" id="search-16" class="dropdown" placeholder="Red Side ban 2"
                        oninput="filterDropdown(16)">
                    <div id="dropdown-items-16" class="dropdown-items"></div>
                </div>
                <div class="dropdown-container">
                    <input type="text" id="search-17" class="dropdown" placeholder="Red Side ban 3"
                        oninput="filterDropdown(17)">
                    <div id="dropdown-items-17" class="dropdown-items"></div>
                </div>
                <div class="dropdown-container">
                    <input type="text" id="search-18" class="dropdown" placeholder="Red Side ban 4"
                        oninput="filterDropdown(18)">
                    <div id="dropdown-items-18" class="dropdown-items"></div>
                </div>
            </div>
        </div>

        <div class="bluelast">
            <div class="container">
                <!-- Input untuk nama tim & score Blue Side -->
                <div class="input-container">
                    <label for="team1">Nama Tim Blue</label>
                    <input id="team1" type="text" value="Blue Side" oninput="updateTeamName()"><br>
                    <label for="file1">Logo Blue</label>
                    <input id="file1" type="file" accept="image/*" onchange="loadImage(event, 'image1')"><br>
                    <label for="team3">Score Blue</label>
                    <input id="team3" type="text" value="0" oninput="updateTeamName()">
                </div>
            </div>
        </div>

        <div class="redlast">
            <div class="container">
                <!-- Input untuk nama tim & score Red Side -->
                <div class="input-container">
                    <label for="team2">Nama Tim Red</label>
                    <input id="team2" type="text" value="Red Side" oninput="updateTeamName()"><br>
                    <label for="file2">Logo Red</label>
                    <input id="file2" type="file" accept="image/*" onchange="loadImage(event, 'image2')"><br>
                    <label for="team4">Score Red</label>
                    <input id="team4" type="text" value="0" oninput="updateTeamName()">
                </div>
            </div>
        </div>

    </div>

    <h2>Timer Control</h2>
    <button id="nextPhase">Next Phase</button>
    <button id="reset">Reset</button>
    <button id="start">Start</button>
    <button id="stop">Stop</button>

    <script src="script.js"></script>
</body>

</html>
